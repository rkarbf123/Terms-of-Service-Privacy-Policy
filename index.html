<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#10111a" />
  <title>이용약관 및 개인정보 보호정책</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #10111a;
      --sidebar: #141520;
      --panel: #191b28;
      --panel-2: #1e2030;
      --border: #2b2d40;
      --text: #f1f1fa;
      --muted: #a0a3bb;
      --accent: #9a7bff;
      --accent-2: #6f56d9;
      --accent-soft: rgba(154, 123, 255, .14);
      --green: #77dfbd;
      --radius: 16px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at 75% 0%, rgba(111, 86, 217, .10), transparent 30rem),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
      line-height: 1.65;
    }
    button { font: inherit; }

    .app { min-height: 100vh; }
    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      width: 258px;
      padding: 26px 17px;
      background: rgba(20, 21, 32, .96);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 10;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 10px 30px;
    }
    .brand-icon {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      background: linear-gradient(145deg, var(--accent), #6752c9);
      box-shadow: 0 8px 24px rgba(111, 86, 217, .25);
      font-size: 21px;
      font-weight: 800;
    }
    .brand-name { font-size: 15px; font-weight: 800; letter-spacing: .12em; }
    .brand-sub { color: var(--muted); font-size: 11px; margin-top: 1px; }
    .nav-label {
      padding: 0 12px;
      color: #777b96;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .12em;
      margin-bottom: 10px;
    }
    .bot-nav { display: grid; gap: 7px; }
    .bot-button {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      border: 1px solid transparent;
      border-radius: 12px;
      padding: 12px;
      text-align: left;
      background: transparent;
      color: #b9bbce;
      cursor: pointer;
      transition: background .18s ease, color .18s ease, border-color .18s ease;
    }
    .bot-button:hover { background: #1d1f2d; color: var(--text); }
    .bot-button.active {
      color: white;
      background: var(--accent-soft);
      border-color: rgba(154, 123, 255, .27);
    }
    .bot-avatar {
      width: 35px;
      height: 35px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 11px;
      background: #292b3d;
      color: #c6b9ff;
      font-weight: 800;
      font-size: 13px;
    }
    .bot-button.active .bot-avatar { background: var(--accent-2); color: white; }
    .bot-name { font-weight: 700; font-size: 14px; }
    .bot-desc { display: block; color: #8589a4; font-size: 11px; margin-top: 1px; }
    .sidebar-footer {
      margin-top: auto;
      padding: 15px 12px 0;
      border-top: 1px solid var(--border);
      color: #81849e;
      font-size: 11px;
    }
    .online-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      background: var(--green);
      border-radius: 50%;
      margin-right: 6px;
      box-shadow: 0 0 10px rgba(119, 223, 189, .4);
    }

    .main { margin-left: 258px; min-height: 100vh; }
    .topbar {
      height: 74px;
      padding: 0 clamp(22px, 5vw, 66px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(43, 45, 64, .8);
      background: rgba(16, 17, 26, .65);
      backdrop-filter: blur(14px);
      position: sticky;
      top: 0;
      z-index: 5;
    }
    .breadcrumb { color: var(--muted); font-size: 13px; }
    .breadcrumb strong { color: var(--text); font-weight: 650; }
    .top-pill {
      color: #c8baff;
      border: 1px solid rgba(154, 123, 255, .25);
      background: var(--accent-soft);
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }
    .content { max-width: 1060px; margin: 0 auto; padding: 48px clamp(22px, 5vw, 66px) 70px; }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #b7a7ff;
      text-transform: uppercase;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .13em;
      margin-bottom: 14px;
    }
    .eyebrow::before { content: ""; width: 19px; height: 2px; background: var(--accent); border-radius: 2px; }
    h1 { margin: 0; font-size: clamp(29px, 4vw, 42px); line-height: 1.2; letter-spacing: -.04em; }
    .intro { color: var(--muted); margin: 14px 0 30px; max-width: 680px; font-size: 14px; }
    .bot-summary {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 19px 21px;
      border: 1px solid var(--border);
      background: linear-gradient(110deg, rgba(154, 123, 255, .09), rgba(25, 27, 40, .8) 65%);
      border-radius: var(--radius);
      margin-bottom: 28px;
    }
    .summary-avatar {
      display: grid;
      place-items: center;
      width: 49px;
      height: 49px;
      flex: 0 0 auto;
      border-radius: 15px;
      color: white;
      font-weight: 850;
      background: linear-gradient(145deg, #9274f8, #5d49bd);
    }
    .summary-title { font-weight: 800; font-size: 16px; }
    .summary-note { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .summary-status { margin-left: auto; color: var(--green); font-size: 11px; white-space: nowrap; }
    .tabs {
      display: flex;
      gap: 7px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 22px;
    }
    .tab {
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: #9296b0;
      padding: 12px 16px 13px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 750;
      margin-bottom: -1px;
    }
    .tab:hover { color: white; }
    .tab.active { color: #cbbfff; border-bottom-color: var(--accent); }
    .doc-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: #8589a3;
      font-size: 11px;
      margin: 0 0 18px;
    }
    .doc {
      background: rgba(25, 27, 40, .78);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: clamp(22px, 4vw, 38px);
      min-height: 340px;
    }
    .doc h2 { margin: 0 0 8px; font-size: 24px; letter-spacing: -.025em; }
    .doc .lead { margin: 0 0 28px; color: var(--muted); font-size: 13px; }
    .doc h3 { margin: 27px 0 8px; font-size: 15px; color: #e3ddff; }
    .doc p, .doc li { color: #b9bbcd; font-size: 13px; }
    .doc p { margin: 8px 0; }
    .doc ul, .doc ol { padding-left: 22px; margin: 8px 0; }
    .doc li { padding-left: 3px; margin: 5px 0; }
    .notice {
      margin-top: 24px;
      padding: 14px 16px;
      border-radius: 11px;
      border: 1px solid rgba(154, 123, 255, .23);
      background: rgba(154, 123, 255, .08);
      color: #c5bddf;
      font-size: 12px;
    }
    .page-footer {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
      padding: 24px 0 0;
      color: #6f738d;
      font-size: 11px;
    }
    .mobile-brand { display: none; }

    @media (max-width: 760px) {
      .sidebar {
        position: static;
        width: 100%;
        height: auto;
        padding: 14px 15px 12px;
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }
      .brand { padding: 0 4px 14px; }
      .brand-icon { width: 36px; height: 36px; border-radius: 11px; }
      .nav-label { padding: 0 4px; margin-bottom: 7px; }
      .bot-nav { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
      .bot-button { padding: 8px 7px; flex-direction: column; justify-content: center; text-align: center; gap: 5px; }
      .bot-avatar { width: 30px; height: 30px; border-radius: 9px; }
      .bot-name { font-size: 12px; }
      .bot-desc, .sidebar-footer { display: none; }
      .main { margin-left: 0; }
      .topbar { position: static; height: 53px; padding: 0 20px; }
      .content { padding-top: 30px; }
      .summary-status { display: none; }
      .doc-meta { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">R</div>
        <div>
          <div class="brand-name">rkarbf123</div>

    <main class="main">

        <div class="top-pill">rkarbf123</div>

      <section class="content">

        <h1>이용약관 & 개인정보 보호정책</h1>

            <div class="summary-title" id="summaryName">시아봇</div>
            <div class="summary-note">이용약관 및 개인정보 보호정책</div>

        <div class="tabs" role="tablist" aria-label="문서 종류">

        </footer>

  <script>
    const bots = {
      sia: {
        name: "시아봇", short: "시", started: "2025년 07월 11일",
        features: ["프로필", "출석 체크", "도박", "랭킹 확인", "낚시"]

        features: ["프로필", "출석 체크", "도박", "랭킹 확인", "칭호", "낚시"]

      const featureList = bot.features.map(feature => `<li>${feature}</li>`).join("");
      return `
        <h2>${botName} 이용약관</h2>
        <p class="lead">본 약관은 ${botName}의 이용 조건과 운영자 및 이용자의 권리·의무를 규정합니다.</p>

        <p>본 약관은 ${botName}(이하 "봇")의 이용 조건과 운영자 및 이용자의 권리·의무, 서비스 이용과 관련한 책임 사항을 규정하는 것을 목적으로 합니다.</p>

        <ol>
          <li>이용자는 봇을 이용하기 전에 본 약관을 확인해야 합니다.</li>
          <li>봇을 이용하는 경우 본 약관이 적용됩니다. 별도의 개인정보 처리 동의가 필요한 경우 해당 절차를 따릅니다.</li>
          <li>이용자는 Discord 이용약관 및 커뮤니티 가이드라인을 준수해야 합니다.</li>
        </ol>

        <h3>제3조 (서비스 내용)</h3>
        <p>봇은 다음 기능을 제공합니다.</p>
        <ul>${featureList}</ul>
        <p>서비스 제공을 위해 Discord 사용자 ID, 채팅 수 및 음성 채널 이용 시간을 처리할 수 있습니다. 기능과 세부 동작은 업데이트 및 운영 상황에 따라 변경될 수 있습니다.</p>

        <h3>제4조 (데이터 수집 및 이용)</h3>
        <p>봇은 서비스 제공을 위해 다음 데이터를 수집·기록합니다.</p>
        <ul>
          <li><strong>Discord 사용자 ID:</strong> 이용자 식별 및 기능별 기록 연결</li>
          <li><strong>채팅 수:</strong> 채팅 활동 집계 및 관련 기능 제공</li>
          <li><strong>음성 이용 시간:</strong> 음성 채널 참여 시간 집계 및 관련 기능 제공</li>
          <li><strong>기능 이용 기록:</strong> 프로필, 출석 체크, 도박, 랭킹, 낚시, 칭호 또는 지령 등 실제 이용한 기능을 제공하는 데 필요한 기록</li>
        </ul>

        <h3>제5조 (게임 기능 및 기록)</h3>
        <ol>
          <li>출석 체크, 도박, 낚시, 칭호, 지령 등 각 기능은 봇에 구현된 규칙과 화면에 표시되는 안내에 따라 이용해야 합니다.</li>
          <li>도박 기능의 보상·확률·포인트 등 구체적인 운영 방식은 실제 봇의 구현 및 별도 안내에 따릅니다. 실제 현금 거래나 현금 가치가 있는 보상이 제공되는 경우에는 이 문서만으로 그 적법성이나 이용 가능성을 보장하지 않습니다.</li>
          <li>오류, 중복 처리 또는 부정 이용이 확인되면 운영자는 관련 기록을 확인하고 필요한 범위에서 결과나 기록을 정정할 수 있습니다.</li>
          <li>봇 내 포인트나 게임 기록이 존재하는 경우, 별도 안내가 없는 한 현금 가치나 현금 교환 가능성을 보장하지 않습니다.</li>
        </ol>

        <h3>제8조 (서비스 변경 및 중단)</h3>

        <h3>제9조 (책임의 제한)</h3>
        <p>운영자의 책임은 관련 법령에 따릅니다. 본 약관은 운영자의 고의 또는 과실에 대한 책임이나 법령상 배제할 수 없는 책임을 면제하지 않습니다.</p>

        <h3>제10조 (문의)</h3>
        <p>서비스, 코인, 랭킹, 상점 또는 데이터 처리와 관련된 문의는 Discord <strong>entrkarb123</strong>에게 연락해 주세요.</p>
      `;
    }

    function privacyDocument(botName) {
      return `
        <h2>${botName} 개인정보 보호정책</h2>
        <p class="lead">본 정책은 ${botName}이 서비스 제공 과정에서 처리하는 데이터의 항목, 이용 목적 및 관리 방법을 안내합니다.</p>

        <h3>제1조 (처리하는 데이터 항목)</h3>
        <ul>
          <li><strong>Discord 사용자 ID:</strong> 이용자 식별 및 기능별 기록 연결</li>
          <li><strong>채팅 수:</strong> 채팅 활동 집계</li>
          <li><strong>음성 이용 시간:</strong> 음성 채널 참여 시간 집계</li>
          <li><strong>기능 이용 기록:</strong> 프로필, 출석 체크, 도박, 랭킹, 낚시, 칭호 또는 지령 기능 제공에 필요한 게임 진행 데이터</li>
        </ul>
        <h3>제2조 (데이터 처리 목적)</h3>
        <ul>
          <li>이용자 식별 및 기능별 데이터 연결</li>
          <li>채팅 수와 음성 이용 시간 집계</li>
          <li>프로필, 출석 체크, 도박, 랭킹, 낚시, 칭호 또는 지령 기능 제공</li>
          <li>오류 확인, 부정 이용 방지 및 서비스 유지·개선</li>
        </ul>

        <h3>제3조 (보관 기간 및 삭제)</h3>
        <p>데이터는 봇의 기능 제공과 운영에 필요한 기간 동안 개인 PC에서 운영되는 SQLite 데이터베이스에 보관됩니다. 현재 구체적인 보관 기간은 별도로 확정되지 않았으므로, 운영자는 실제 보관·삭제 기준을 정해 이 정책에 반영해야 합니다.</p>
        <p>이용자는 운영자에게 Discord DM을 보내거나 관련 서버에서 문의 티켓을 생성하여 데이터 삭제를 요청할 수 있습니다. 운영자는 요청자를 확인하고, 관련 법령 및 서비스 운영상 필요한 사항을 검토한 뒤 처리 결과를 안내합니다. 백업 등으로 인해 즉시 완전히 삭제되지 않을 수 있는 경우 그 기준을 별도로 안내해야 합니다.</p>

        <h3>제4조 (저장 환경 및 제3자 제공)</h3>
        <p>봇은 운영자가 관리하는 개인 PC에서 실행되며, 데이터베이스로 SQLite를 사용합니다. 이에 따라 데이터는 해당 PC의 저장 환경에 기록될 수 있습니다. 운영자는 관련 법령에 근거하거나 적법한 절차가 있는 경우를 제외하고 데이터를 임의로 제3자에게 제공하지 않습니다. Discord 플랫폼 자체의 데이터 처리에는 Discord의 정책이 별도로 적용됩니다.</p>

        <h3>제5조 (이용자의 요청)</h3>
        <p>이용자는 데이터 처리 관련 문의, 열람 또는 삭제 요청을 운영자에게 Discord DM으로 보내거나 서버 문의 티켓을 생성하여 제출할 수 있습니다. 운영자는 요청자의 식별 및 관련 법령을 확인한 뒤 처리 가능 여부와 필요한 조치를 안내합니다.</p>

        <h3>제6조 (보안 및 관리)</h3>
        <p>운영자는 데이터의 무단 접근, 유출, 훼손 및 오용을 방지하기 위해 서비스 환경에 적합한 보호 조치를 적용하도록 노력합니다.</p>

        <h3>제7조 (정책 변경)</h3>
        <p>수집 항목, 이용 목적 또는 서비스 운영 방식이 변경되는 경우 본 정책을 수정하고 변경 내용을 적절한 방법으로 안내합니다.</p>

        <h3>제8조 (문의처)</h3>
        <p>개인정보 및 데이터 처리 관련 문의·삭제 요청은 Discord <strong>entrkarb123</strong>에게 DM을 보내거나, 해당 봇이 운영되는 서버에서 문의 티켓을 생성해 주세요.</p>
      `;
    }

    function render() {
      const bot = bots[selectedBot];
      document.getElementById("breadcrumbBot").textContent = bot.name;
      document.getElementById("summaryName").textContent = bot.name;
      document.getElementById("summaryAvatar").textContent = bot.short;
      document.getElementById("docType").textContent = selectedDoc === "terms" ? "이용약관" : "개인정보 보호정책";
      document.getElementById("documentContent").innerHTML =
        selectedDoc === "terms" ? termsDocument(bot.name) : privacyDocument(bot.name);

      document.querySelectorAll(".bot-button").forEach(button => {
        const active = button.dataset.bot === selectedBot;
        button.classList.toggle("active", active);
        if (active) button.setAttribute("aria-current", "page");
        else button.removeAttribute("aria-current");
      });

      document.querySelectorAll(".tab").forEach(button => {
        const active = button.dataset.doc === selectedDoc;
        button.classList.toggle("active", active);
        button.setAttribute("aria-selected", String(active));
      });
    }

    document.querySelectorAll(".bot-button").forEach(button => {
      button.addEventListener("click", () => {
        selectedBot = button.dataset.bot;
        render();
      });
    });

    document.querySelectorAll(".tab").forEach(button => {
      button.addEventListener("click", () => {
        selectedDoc = button.dataset.doc;
        render();
      });
    });

    render();
  </script>
</body>
</html>
